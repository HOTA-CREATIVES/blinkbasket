name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin: the code uses APIs newer than the old "3.27.x" pin
      # (e.g. Switch.activeThumbColor needs 3.31+), so that pin could never
      # compile. Track stable, and pin an exact version here once you settle on
      # one for releases.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Errors and warnings fail the build; deprecation *infos* don't.
      - run: flutter analyze --no-pub --no-fatal-infos

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  functions-build:
    name: Cloud Functions Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  functions-test:
    name: Cloud Functions + Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools
      # Almost every suite is an integration test against the Firestore (and,
      # for rider/account tests, Auth) emulator on the ports in firebase.json —
      # a bare `npm test` has nothing to talk to and fails. exec starts the
      # emulators, runs the suite, and shuts them down.
      - run: >
          firebase emulators:exec --only firestore,auth --project demo-hypermart
          "npm --prefix functions test"
